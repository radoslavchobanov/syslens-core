{
  "name": "syslens-ollama",
  "services": {
    "ollama": {
      "image": "${OLLAMA_IMAGE:?Set an official ollama/ollama image tag or digest in .env}",
      "environment": {
        "OLLAMA_HOST": "0.0.0.0:11434",
        "OLLAMA_NO_CLOUD": "1",
        "OLLAMA_NUM_PARALLEL": "1",
        "OLLAMA_MAX_LOADED_MODELS": "1",
        "OLLAMA_MAX_QUEUE": "4",
        "OLLAMA_CONTEXT_LENGTH": "4096",
        "OLLAMA_KEEP_ALIVE": "5m",
        "OLLAMA_VULKAN": "0"
      },
      "ports": [
        {"target": 11434, "published": "11434", "host_ip": "${OLLAMA_LAN_IP:?Set the Acemagic private LAN IPv4 address}", "protocol": "tcp"}
      ],
      "volumes": [
        {"type": "bind", "source": "./data", "target": "/root/.ollama", "bind": {"create_host_path": false}}
      ],
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"],
      "cpus": "${OLLAMA_CPUS:-4}",
      "mem_limit": "${OLLAMA_MEMORY:-8g}",
      "pids_limit": 512,
      "restart": "unless-stopped",
      "stop_grace_period": "30s",
      "healthcheck": {
        "test": ["CMD", "ollama", "list"],
        "interval": "30s", "timeout": "10s", "start_period": "30s", "retries": 3
      },
      "logging": {"driver": "json-file", "options": {"max-size": "10m", "max-file": "3"}}
    }
  }
}
