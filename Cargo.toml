[package]
name = "syslens-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Low-overhead Linux telemetry core for SysLens"

[[bin]]
name = "syslens"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hostname = "0.4"
libc = "0.2"
rumqttc = "0.25"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
ratatui = "0.29"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
