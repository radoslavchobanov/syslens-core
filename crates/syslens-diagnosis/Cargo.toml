[package]
name = "syslens-diagnosis"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Optional local diagnosis companion for SysLens"

[[bin]]
name = "syslens-diagnosis"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syslens-protocol = { path = "../syslens-protocol" }
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-rustls = "0.26"
uuid = { version = "1.12", features = ["v4"] }
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
rustls = "0.23"
rustls-pemfile = "2.2"
hyper-util = { version = "0.1", features = ["server", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
tower = "0.5"

[dev-dependencies]
tempfile = "3.14"
