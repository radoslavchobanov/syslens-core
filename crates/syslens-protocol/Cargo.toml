[package]
name = "syslens-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Versioned bounded evidence protocol for SysLens"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
