name: Release Debian packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package and publish
        required: true
        type: string
      publish_apt:
        description: Also publish this final release to the signed stable APT repository
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.debian_arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            debian_arch: amd64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            debian_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.rust_target }}

      - name: Build Debian package
        env:
          VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${VERSION#v}"
          packaging/debian/build-deb.sh \
            "target/${{ matrix.rust_target }}/release/syslens" \
            "${version}" \
            "${{ matrix.debian_arch }}" \
            dist

      - uses: actions/upload-artifact@v4
        with:
          name: syslens-core-${{ matrix.debian_arch }}
          path: dist/*.deb

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/**/*.deb --clobber
          else
            gh release create "${TAG}" dist/**/*.deb --generate-notes
          fi

  publish-apt:
    name: Publish signed APT repository
    needs: build
    if: >-
      vars.APT_REPOSITORY_ENABLED == 'true' &&
      !contains(inputs.release_tag || github.ref_name, '-') &&
      (github.event_name == 'push' || inputs.publish_apt)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          path: source

      - name: Check out static repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install APT repository tools
        run: sudo apt-get update && sudo apt-get install --yes apt-utils dpkg-dev gnupg

      - name: Import release signing subkey
        env:
          GNUPGHOME: ${{ runner.temp }}/syslens-gnupg
          SIGNING_KEY: ${{ secrets.SYSLENS_APT_SIGNING_KEY }}
        run: |
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/syslens-signing-key.asc"
          gpg --batch --import "$RUNNER_TEMP/syslens-signing-key.asc"
          rm -f "$RUNNER_TEMP/syslens-signing-key.asc"

      - name: Update and sign static repository
        env:
          GNUPGHOME: ${{ runner.temp }}/syslens-gnupg
          SYSLENS_APT_SIGNING_PASSPHRASE: ${{ secrets.SYSLENS_APT_SIGNING_PASSPHRASE }}
          SIGNING_FINGERPRINT: ${{ vars.SYSLENS_APT_SIGNING_FINGERPRINT }}
        run: |
          source/packaging/apt/build-repository.sh \
            --repository pages/apt \
            --packages artifacts \
            --signing-key "$SIGNING_FINGERPRINT"

      - name: Commit static repository
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd pages
          git config user.name 'syslens-release[bot]'
          git config user.email 'syslens-release[bot]@users.noreply.github.com'
          git add apt
          if ! git diff --cached --quiet; then
            git commit -m "Publish APT repository for ${TAG}"
            git push origin gh-pages
          fi

      - name: Prepare static Pages artifact
        run: |
          mkdir published
          cp -a pages/apt published/apt
          touch published/.nojekyll

      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: published

  deploy-apt-pages:
    name: Deploy APT repository to GitHub Pages
    needs: publish-apt
    if: needs.publish-apt.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy static Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
